services:
  jarvis:
    build: .
    container_name: jarvis
    restart: unless-stopped
    # Adjusted to match J.A.R.V.I.S.'s internal boot port (8080)
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - FRIDAY_URL=http://friday:8000
    volumes:
      - jarvis_memory:/app/memory
      - jarvis_data:/app/data
      - jarvis_backups:/app/backups
      - ./config:/app/config:ro
    # Updated health check to point to the correct port 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  friday:
    build: ../FRIDAY
    container_name: friday
    restart: unless-stopped
    # Adjusted to standard service allocation, making room for J.A.R.V.I.S.
    ports:
      - "8000:8000"
    env_file:
      - ../FRIDAY/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - JARVIS_URL=http://jarvis:8080
      - JARVIS_MEMORY_PATH=/jarvis_memory/short_term.json
    volumes:
      - jarvis_memory:/jarvis_memory:ro
      - friday_memory:/app/memory
    depends_on:
      jarvis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  jarvis_memory:
  jarvis_data:
  jarvis_backups:
  friday_memory: