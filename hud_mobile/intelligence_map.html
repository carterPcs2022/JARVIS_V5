<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS — Global Intelligence</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #000;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  color: #ff8c00;
}
canvas { display: block; }

/* HUD overlay */
.hud-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}

/* Corner brackets */
.corner {
  position: absolute;
  width: 24px; height: 24px;
}
.c-tl { top:12px; left:12px;
  border-top:2px solid rgba(255,140,0,0.5);
  border-left:2px solid rgba(255,140,0,0.5); }
.c-tr { top:12px; right:12px;
  border-top:2px solid rgba(255,140,0,0.5);
  border-right:2px solid rgba(255,140,0,0.5); }
.c-bl { bottom:12px; left:12px;
  border-bottom:2px solid rgba(255,140,0,0.5);
  border-left:2px solid rgba(255,140,0,0.5); }
.c-br { bottom:12px; right:12px;
  border-bottom:2px solid rgba(255,140,0,0.5);
  border-right:2px solid rgba(255,140,0,0.5); }

/* Header */
.hud-header {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(180deg,
    rgba(0,0,0,0.8) 0%, transparent 100%);
}

.hud-title {
  font-size: 11px;
  letter-spacing: 6px;
  color: rgba(255,140,0,0.9);
  text-shadow: 0 0 10px rgba(255,140,0,0.4);
}

.hud-status {
  font-size: 9px;
  letter-spacing: 3px;
  color: rgba(255,140,0,0.5);
}

/* Threat counter */
.threat-panel {
  position: absolute;
  top: 60px;
  right: 24px;
  text-align: right;
}

.threat-count {
  font-size: 48px;
  font-weight: 900;
  color: #ff3b30;
  text-shadow: 0 0 20px rgba(255,59,48,0.5);
  line-height: 1;
}

.threat-label {
  font-size: 9px;
  letter-spacing: 3px;
  color: rgba(255,140,0,0.5);
}

/* Left data panel */
.data-left {
  position: absolute;
  top: 60px;
  left: 24px;
  width: 180px;
}

.data-item {
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,140,0,0.1);
}
.data-item:last-child { border:none; }
.data-label {
  font-size: 8px;
  letter-spacing: 2px;
  color: rgba(255,140,0,0.4);
  margin-bottom: 2px;
}
.data-value {
  font-size: 12px;
  color: rgba(255,140,0,0.9);
}
.data-value.danger { color: #ff3b30; }
.data-value.safe   { color: #34c759; }

/* Bottom bar */
.hud-footer {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(0deg,
    rgba(0,0,0,0.8) 0%, transparent 100%);
}

.footer-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.f-val {
  font-size: 13px;
  color: rgba(255,140,0,0.9);
}
.f-lbl {
  font-size: 8px;
  letter-spacing: 2px;
  color: rgba(255,140,0,0.4);
}

/* Back button */
.back-btn {
  position: absolute;
  bottom: 60px;
  left: 24px;
  padding: 6px 16px;
  border: 1px solid rgba(255,140,0,0.3);
  border-radius: 2px;
  background: rgba(0,0,0,0.5);
  color: rgba(255,140,0,0.7);
  font-family: inherit;
  font-size: 9px;
  letter-spacing: 2px;
  cursor: pointer;
  pointer-events: all;
  text-decoration: none;
  display: inline-block;
}
.back-btn:hover {
  border-color: rgba(255,140,0,0.7);
  color: rgba(255,140,0,1);
}

/* Scanline */
.scanline {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
  );
}

/* Loading */
#loading {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  z-index: 100;
  transition: opacity 1s;
}
.loading-text {
  font-size: 10px;
  letter-spacing: 4px;
  color: rgba(255,140,0,0.7);
}
.loading-bar {
  width: 200px;
  height: 2px;
  background: rgba(255,140,0,0.1);
  border-radius: 1px;
  overflow: hidden;
}
.loading-fill {
  height: 100%;
  background: rgba(255,140,0,0.7);
  border-radius: 1px;
  animation: load-progress 2s ease forwards;
}
@keyframes load-progress {
  0%   { width: 0%; }
  100% { width: 100%; }
}
</style>
</head>
<body>

<!-- Loading screen -->
<div id="loading">
  <div class="loading-text">INITIALIZING GLOBAL INTELLIGENCE</div>
  <div class="loading-bar">
    <div class="loading-fill"></div>
  </div>
  <div class="loading-text" style="font-size:8px;opacity:0.4">
    STARK INDUSTRIES — CLASSIFIED
  </div>
</div>

<!-- Three.js canvas -->
<canvas id="globe"></canvas>

<!-- HUD Overlay -->
<div class="hud-overlay">
  <div class="scanline"></div>
  <div class="corner c-tl"></div>
  <div class="corner c-tr"></div>
  <div class="corner c-bl"></div>
  <div class="corner c-br"></div>

  <div class="hud-header">
    <div class="hud-title">STARK GLOBAL INTELLIGENCE — LIVE</div>
    <div class="hud-status" id="clock">--:--:--</div>
  </div>

  <div class="data-left" id="data-left">
    <div class="data-item">
      <div class="data-label">ACTIVE THREATS</div>
      <div class="data-value danger" id="d-threats">—</div>
    </div>
    <div class="data-item">
      <div class="data-label">NETWORK STATUS</div>
      <div class="data-value safe" id="d-network">SECURE</div>
    </div>
    <div class="data-item">
      <div class="data-label">SENTINEL</div>
      <div class="data-value" id="d-sentinel">ACTIVE</div>
    </div>
    <div class="data-item">
      <div class="data-label">UPTIME</div>
      <div class="data-value" id="d-uptime">—</div>
    </div>
    <div class="data-item">
      <div class="data-label">DEFCON</div>
      <div class="data-value safe" id="d-defcon">5 — NORMAL</div>
    </div>
  </div>

  <div class="threat-panel">
    <div class="threat-count" id="t-count">0</div>
    <div class="threat-label">THREATS</div>
    <div class="threat-label">LAST 24H</div>
  </div>

  <div class="hud-footer">
    <div class="footer-stat">
      <div class="f-val" id="f-lat">—</div>
      <div class="f-lbl">LATENCY</div>
    </div>
    <div class="footer-stat">
      <div class="f-val" id="f-cpu">—</div>
      <div class="f-lbl">CPU</div>
    </div>
    <div class="footer-stat">
      <div class="f-val" id="f-ram">—</div>
      <div class="f-lbl">RAM</div>
    </div>
    <div class="footer-stat">
      <div class="f-val">JARVIS V5</div>
      <div class="f-lbl">SYSTEM</div>
    </div>
  </div>

  <a class="back-btn" href="/hud">← MAIN HUD</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Same API-base + token pattern as hud_mobile/desktop.html — no
// hardcoded token here. /hud/status itself doesn't require auth (no
// verify_token dependency on that route), so the Authorization header is
// only attached when a token happens to already be in localStorage.
const HOST   = location.hostname;
const API    = `${location.protocol}//${HOST}${location.protocol === 'https:' ? '' : ':8000'}`;
function getToken() { return localStorage.getItem('jarvis_token') || ''; }
function authHeaders() {
  const token = getToken();
  return token ? { 'Authorization': `Bearer ${token}` } : {};
}

// ── Clock ─────────────────────────────────────────────────────────────────────
function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-US',{hour12:false});
}
setInterval(tick,1000); tick();

// ── Scene setup ───────────────────────────────────────────────────────────────
const canvas   = document.getElementById('globe');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000, 1);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(
  60, window.innerWidth/window.innerHeight, 0.1, 1000
);
camera.position.z = 3.5;

// ── Lighting ──────────────────────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0xff8c00, 0.2);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0xffa500, 1, 10);
pointLight.position.set(2, 2, 2);
scene.add(pointLight);

// ── Globe wireframe (Sokovia style) ───────────────────────────────────────────
const RADIUS = 1.5;

// Base sphere wireframe
const sphereGeo  = new THREE.SphereGeometry(RADIUS, 24, 16);
const sphereMat  = new THREE.MeshBasicMaterial({
  color:       0xff8c00,
  wireframe:   true,
  opacity:     0.08,
  transparent: true,
});
const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
scene.add(sphereMesh);

// ── Golden filament network (the Sokovia data lines) ──────────────────────────
const GROUP = new THREE.Group();
scene.add(GROUP);

// Generate random points on sphere surface
function randomSpherePoint(r) {
  const u     = Math.random();
  const v     = Math.random();
  const theta = 2 * Math.PI * u;
  const phi   = Math.acos(2 * v - 1);
  return new THREE.Vector3(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.sin(phi) * Math.sin(theta),
    r * Math.cos(phi)
  );
}

// Threat hotspots (lat/lon converted to 3D)
const HOTSPOTS = [
  {lat:40.7,  lon:-74.0,  intensity:0.9, label:'NEW YORK'},
  {lat:51.5,  lon:-0.1,   intensity:0.7, label:'LONDON'},
  {lat:48.8,  lon:2.3,    intensity:0.6, label:'PARIS'},
  {lat:35.7,  lon:139.7,  intensity:0.8, label:'TOKYO'},
  {lat:55.7,  lon:37.6,   intensity:0.9, label:'MOSCOW'},
  {lat:39.9,  lon:116.4,  intensity:0.8, label:'BEIJING'},
  {lat:28.6,  lon:77.2,   intensity:0.5, label:'NEW DELHI'},
  {lat:-23.5, lon:-46.6,  intensity:0.4, label:'SÃO PAULO'},
  {lat:37.5,  lon:127.0,  intensity:0.6, label:'SEOUL'},
  {lat:19.4,  lon:-99.1,  intensity:0.5, label:'MEXICO CITY'},
  {lat:1.3,   lon:103.8,  intensity:0.7, label:'SINGAPORE'},
  {lat:41.0,  lon:29.0,   intensity:0.6, label:'ISTANBUL'},
];

function latLonTo3D(lat, lon, r) {
  const phi   = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

// Draw filament lines between hotspots
const lineMat = new THREE.LineBasicMaterial({
  color:       0xffa500,
  opacity:     0.4,
  transparent: true,
});

const dimLineMat = new THREE.LineBasicMaterial({
  color:       0xff6600,
  opacity:     0.15,
  transparent: true,
});

// Connect each hotspot to nearby ones
for (let i = 0; i < HOTSPOTS.length; i++) {
  for (let j = i+1; j < HOTSPOTS.length; j++) {
    const a = latLonTo3D(HOTSPOTS[i].lat, HOTSPOTS[i].lon, RADIUS);
    const b = latLonTo3D(HOTSPOTS[j].lat, HOTSPOTS[j].lon, RADIUS);

    // Arc through space (not through globe)
    const mid    = a.clone().add(b).multiplyScalar(0.5);
    const midLen = mid.length();
    mid.normalize().multiplyScalar(midLen + 0.3 + Math.random() * 0.4);

    const curve  = new THREE.QuadraticBezierCurve3(a, mid, b);
    const points = curve.getPoints(20);
    const geo    = new THREE.BufferGeometry().setFromPoints(points);
    const mat    = Math.random() > 0.4 ? dimLineMat : lineMat;
    GROUP.add(new THREE.Line(geo, mat));
  }
}

// Random filament network across globe
const points = [];
for (let i = 0; i < 80; i++) {
  points.push(randomSpherePoint(RADIUS));
}

for (let i = 0; i < points.length; i++) {
  const count = Math.floor(Math.random() * 3) + 1;
  for (let c = 0; c < count; c++) {
    const j = Math.floor(Math.random() * points.length);
    if (i === j) continue;
    const a   = points[i];
    const b   = points[j];
    const mid = a.clone().add(b).multiplyScalar(0.5);
    mid.normalize().multiplyScalar(RADIUS + 0.1 + Math.random()*0.3);
    const curve  = new THREE.QuadraticBezierCurve3(a, mid, b);
    const pts    = curve.getPoints(12);
    const geo    = new THREE.BufferGeometry().setFromPoints(pts);
    GROUP.add(new THREE.Line(geo, new THREE.LineBasicMaterial({
      color:       0xff8c00,
      opacity:     0.06 + Math.random() * 0.1,
      transparent: true,
    })));
  }
}

// ── Hotspot dots ──────────────────────────────────────────────────────────────
HOTSPOTS.forEach(hs => {
  const pos  = latLonTo3D(hs.lat, hs.lon, RADIUS + 0.01);
  const size = 0.02 + hs.intensity * 0.025;

  // Inner dot
  const geo  = new THREE.SphereGeometry(size, 8, 8);
  const mat  = new THREE.MeshBasicMaterial({
    color: hs.intensity > 0.7 ? 0xff3b30 : 0xff8c00,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  GROUP.add(mesh);

  // Outer ring pulse
  const ringGeo = new THREE.RingGeometry(size*1.5, size*2.5, 16);
  const ringMat = new THREE.MeshBasicMaterial({
    color:       hs.intensity > 0.7 ? 0xff3b30 : 0xffa500,
    opacity:     0.4,
    transparent: true,
    side:        THREE.DoubleSide,
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.copy(pos);
  ring.lookAt(0, 0, 0);
  GROUP.add(ring);
});

// ── Inner glow sphere ─────────────────────────────────────────────────────────
const innerGeo = new THREE.SphereGeometry(RADIUS * 0.95, 32, 32);
const innerMat = new THREE.MeshBasicMaterial({
  color:       0xff6600,
  opacity:     0.04,
  transparent: true,
});
GROUP.add(new THREE.Mesh(innerGeo, innerMat));

// ── Particle cloud (like the Sokovia data particles) ─────────────────────────
const particleCount = 3000;
const particlePositions = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {
  const p = randomSpherePoint(RADIUS + Math.random() * 0.3);
  particlePositions[i*3]   = p.x;
  particlePositions[i*3+1] = p.y;
  particlePositions[i*3+2] = p.z;
}

const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute(
  'position',
  new THREE.BufferAttribute(particlePositions, 3)
);
const particleMat = new THREE.PointsMaterial({
  color:       0xff8c00,
  size:        0.015,
  opacity:     0.4,
  transparent: true,
});
GROUP.add(new THREE.Points(particleGeo, particleMat));

// ── Mouse drag interaction ────────────────────────────────────────────────────
let isDragging = false;
let prevMouse  = {x:0, y:0};
let velocity   = {x:0, y:0};

canvas.addEventListener('mousedown', e => {
  isDragging = true;
  prevMouse  = {x:e.clientX, y:e.clientY};
  velocity   = {x:0, y:0};
});

canvas.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  velocity = {x:dy*0.005, y:dx*0.005};
  GROUP.rotation.x += velocity.x;
  GROUP.rotation.y += velocity.y;
  sphereMesh.rotation.x += velocity.x;
  sphereMesh.rotation.y += velocity.y;
  prevMouse = {x:e.clientX, y:e.clientY};
});

canvas.addEventListener('mouseup',    () => isDragging = false);
canvas.addEventListener('mouseleave', () => isDragging = false);

// Touch support
canvas.addEventListener('touchstart', e => {
  isDragging = true;
  prevMouse  = {x:e.touches[0].clientX, y:e.touches[0].clientY};
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!isDragging) return;
  const dx = e.touches[0].clientX - prevMouse.x;
  const dy = e.touches[0].clientY - prevMouse.y;
  velocity = {x:dy*0.005, y:dx*0.005};
  GROUP.rotation.x += velocity.x;
  GROUP.rotation.y += velocity.y;
  sphereMesh.rotation.x += velocity.x;
  sphereMesh.rotation.y += velocity.y;
  prevMouse = {x:e.touches[0].clientX, y:e.touches[0].clientY};
}, {passive:false});
canvas.addEventListener('touchend', () => isDragging = false);

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ── Animation loop ────────────────────────────────────────────────────────────
let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.005;

  if (!isDragging) {
    // Auto-rotate
    GROUP.rotation.y += 0.0015;
    sphereMesh.rotation.y += 0.0015;

    // Apply velocity decay
    velocity.x *= 0.95;
    velocity.y *= 0.95;
    GROUP.rotation.x += velocity.x;
    GROUP.rotation.y += velocity.y;
    sphereMesh.rotation.x += velocity.x;
    sphereMesh.rotation.y += velocity.y;
  }

  // Pulse the inner glow
  innerMat.opacity = 0.03 + Math.sin(time * 2) * 0.015;

  // Pulse hotspot rings
  GROUP.children.forEach((child, i) => {
    if (child.geometry && child.geometry.type === 'RingGeometry') {
      child.material.opacity =
        0.2 + Math.sin(time * 3 + i) * 0.2;
      const pulse = 1 + Math.sin(time * 4 + i) * 0.1;
      child.scale.setScalar(pulse);
    }
  });

  renderer.render(scene, camera);
}

animate();

// ── Load HUD data ─────────────────────────────────────────────────────────────
// Field names match the REAL /hud/status response shape (nested
// system/security objects, uptime_seconds not uptime_str, no
// sentinel_threats/latency_ms fields at all) — not the flat
// d.sentinel_threats/d.uptime_str/d.latency_ms/d.cpu/d.ram this page
// originally assumed, which would have silently shown placeholders
// forever since none of those top-level keys exist.
function formatUptime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}

async function loadData() {
  try {
    const startedAt = performance.now();
    const r = await fetch(`${API}/hud/status`, { headers: authHeaders() });
    const d = await r.json();
    const latencyMs = Math.round(performance.now() - startedAt);

    const set = (id, val) => {
      const el = document.getElementById(id);
      if (el) el.textContent = val;
    };

    const threats = (d.security && d.security.threats_24h) || 0;
    set('d-threats', threats);
    set('t-count',   threats);
    set('d-uptime',  d.uptime_seconds !== undefined ? formatUptime(d.uptime_seconds) : '—');
    set('f-lat',     `${latencyMs}ms`);
    set('f-cpu',     d.system && d.system.cpu !== undefined ? `${d.system.cpu}%` : '—');
    set('f-ram',     d.system && d.system.ram !== undefined ? `${d.system.ram}%` : '—');

    const tEl = document.getElementById('t-count');
    if (tEl) {
      tEl.style.color = threats > 50 ? '#ff3b30' :
                        threats > 10 ? '#ff9500' : '#34c759';
    }
  } catch(e) {}
}

// Dismiss loading screen
setTimeout(() => {
  const loading = document.getElementById('loading');
  loading.style.opacity = '0';
  setTimeout(() => loading.remove(), 1000);
}, 2200);

loadData();
setInterval(loadData, 10000);
</script>
</body>
</html>
