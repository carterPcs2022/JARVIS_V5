<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>J.A.R.V.I.S — STARK HUD 2.0</title>
<style>
:root{--bg:#020608;--cyan:#63ddff;--cyan2:#b8f3ff;--gold:#e9bd62;--red:#ff5252;--green:#39e58c;--amber:#ffad42;--muted:#4b7482;--text:#e7f8ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 48%,#09202a 0,#03090c 38%,#010304 78%);color:var(--text);font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(99,221,255,.018) 3px 4px);z-index:50}
.header{position:fixed;top:18px;left:24px;right:24px;display:flex;align-items:center;z-index:10}.brand{font-size:18px;letter-spacing:5px;color:var(--cyan)}.modebar{margin:auto;display:flex;gap:6px}.modebar button{background:rgba(4,20,27,.7);border:1px solid #17404d;color:var(--muted);padding:7px 12px;font:inherit;font-size:9px;letter-spacing:2px;cursor:pointer}.modebar button.active,.modebar button:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px #63ddff22}.status{font-size:9px;color:var(--green)}.status.off{color:var(--red)}
.stage{position:absolute;inset:0;display:grid;place-items:center}.reactor{position:relative;width:min(58vw,620px);height:min(58vw,620px);max-height:75vh;max-width:75vh}.ring{position:absolute;inset:0;border:1px solid #63ddff2b;border-radius:50%;box-shadow:0 0 30px #63ddff12,inset 0 0 40px #63ddff08}.r1{transform:rotate(17deg) scale(.92);border-style:dashed;animation:spin 28s linear infinite}.r2{inset:9%;transform:rotate(-22deg);border-color:#e9bd6238;animation:spin 20s linear infinite reverse}.r3{inset:19%;border-style:dotted;animation:spin 35s linear infinite}.core{position:absolute;inset:34%;border-radius:50%;border:2px solid var(--cyan);box-shadow:0 0 22px var(--cyan),inset 0 0 35px #63ddff55;display:grid;place-items:center;background:#06151b}.core span{text-align:center;font-size:10px;color:var(--cyan2);line-height:2}.core strong{display:block;font-size:18px;letter-spacing:4px}.node{position:absolute;width:92px;height:46px;transform:translate(-50%,-50%);text-align:center;cursor:pointer}.node .dot{width:9px;height:9px;margin:auto;border-radius:50%;background:var(--green);box-shadow:0 0 12px currentColor}.node.warn .dot{background:var(--amber)}.node.off .dot{background:var(--red)}.node small{display:block;margin-top:6px;color:var(--cyan);font-size:9px}.n0{left:50%;top:3%}.n1{left:86%;top:19%}.n2{left:97%;top:50%}.n3{left:86%;top:81%}.n4{left:50%;top:97%}.n5{left:14%;top:81%}.n6{left:3%;top:50%}.n7{left:14%;top:19%}
.panel{position:fixed;right:28px;top:92px;width:330px;min-height:160px;padding:16px;border:1px solid #63ddff55;background:#031015ee;clip-path:polygon(0 0,96% 0,100% 12%,100% 100%,4% 100%,0 88%);box-shadow:0 0 35px #63ddff12;display:none;z-index:20}.panel.show{display:block;animation:in .2s ease-out}.panel h2{margin:0 0 12px;color:var(--cyan);font-size:11px;letter-spacing:3px}.row{display:flex;justify-content:space-between;gap:20px;padding:7px 0;border-bottom:1px solid #63ddff12}.value{color:var(--cyan2);text-align:right}.event{position:fixed;left:28px;bottom:28px;width:340px;padding:10px 14px;border-left:2px solid var(--cyan);background:#031015dd;color:var(--muted);z-index:20}.event b{color:var(--cyan)}.footer{position:fixed;bottom:18px;right:24px;color:var(--muted);font-size:9px;z-index:10}@keyframes spin{to{transform:rotate(377deg)}}@keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@media(max-width:800px){.modebar{display:none}.panel{left:18px;right:18px;width:auto}.reactor{width:82vw;height:82vw}.event{left:18px;bottom:18px;width:calc(100% - 36px)}}
</style></head>
<body>
<header class="header"><div class="brand">J.A.R.V.I.S // STARK HUD 2.0</div><nav class="modebar">
<button data-mode="HOME" class="active">HOME</button><button data-mode="DIAGNOSTICS">DIAGNOSTICS</button><button data-mode="ENGINEERING">ENGINEERING</button><button data-mode="ANALYSIS">ANALYSIS</button><button data-mode="COMMS">COMMS</button><button data-mode="SECURITY">SECURITY</button><button data-mode="SUIT LINK">SUIT LINK</button>
</nav><div class="status" id="status">● ONLINE</div></header>
<main class="stage"><div class="reactor">
<div class="ring"></div><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
<div class="core"><span><strong>JARVIS</strong><span id="coreState">CORE NOMINAL</span></span></div>
<div class="node n0" data-key="voice"><div class="dot"></div><small>VOICE</small></div><div class="node n1" data-key="memory"><div class="dot"></div><small>MEMORY</small></div><div class="node n2" data-key="llm"><div class="dot"></div><small>LLM CORE</small></div><div class="node n3" data-key="engineering"><div class="dot"></div><small>ENGINEERING</small></div><div class="node n4" data-key="security"><div class="dot"></div><small>SECURITY</small></div><div class="node n5" data-key="friday"><div class="dot"></div><small>FRIDAY</small></div><div class="node n6" data-key="network"><div class="dot"></div><small>NETWORK</small></div><div class="node n7" data-key="sandbox"><div class="dot"></div><small>SANDBOX</small></div>
</div></main>
<section class="panel" id="panel"><h2 id="panelTitle">SYSTEM</h2><div id="panelBody"></div></section>
<div class="event" id="event"><b>STARK EVENT BUS</b><br><span id="eventText">Initializing live subsystem telemetry...</span></div>
<div class="footer">STARK HUD 2.0 • HEALTH CONTRACT v1 • ${location.hostname}</div>
<script>
const token=localStorage.getItem('jarvis_token')||new URLSearchParams(location.search).get('token')||'';
if(token){localStorage.setItem('jarvis_token',token);history.replaceState({},'',location.pathname)}
const headers=()=>({Authorization:'Bearer '+(localStorage.getItem('jarvis_token')||'')});
async function get(p){const r=await fetch(p,{headers:headers()});if(r.status===401||r.status===403)throw Error('AUTH');return r.json()}
const panel=document.getElementById('panel'),title=document.getElementById('panelTitle'),body=document.getElementById('panelBody'),eventText=document.getElementById('eventText');let health=null;
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fmtUptime(s){s=Number(s||0);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h+'h '+m+'m '+sec+'s'}
function renderPanel(key){const map={voice:'VOICE SUBSYSTEM',memory:'MEMORY MATRIX',llm:'LLM CORE',engineering:'ENGINEERING MODE',security:'SECURITY GOVERNANCE',friday:'FRIDAY COMMS',network:'NETWORK FABRIC',sandbox:'SANDBOX'};const c=(health?.components||[]).find(x=>String(x.name).toLowerCase()===key);let rows=c?[['STATUS',c.status?.toUpperCase()],['DETAIL',c.reason||'No diagnostic detail']]:[];if(key==='llm'){rows=[['ACTIVE MODEL',health?.active?.model||'—'],['ACTIVE PROVIDER',health?.active?.provider||'—'],['ACTIVE TIER',health?.active?.tier||'—'],...((health?.providers||[]).map(x=>[x.name,x.status.toUpperCase()]))];}if(key==='voice')rows=[['STATUS',c?.status?.toUpperCase()||'STANDBY'],['DETAIL',c?.reason||'Voice subsystem ready'],['HEALTH POLL','5 SECOND INTERVAL']];if(key==='memory')rows=[['STATUS',c?.status?.toUpperCase()||'ONLINE'],['DETAIL',c?.reason||'Memory gate operational'],['CONTEXT GATE','ACTIVE']];if(key==='friday')rows=[['STATUS',c?.status?.toUpperCase()||'STANDBY'],['MODE','INTENTIONALLY DEACTIVATED'],['SUIT LINK','NOT CONNECTED'],['CONTROL','MANUAL REACTIVATION']];if(key==='engineering')rows=[['STATUS',c?.status?.toUpperCase()||'STANDBY'],['WORKFLOW','INSPECT → PROPOSE → VALIDATE → APPROVE'],['APPLY','REQUIRES USER APPROVAL'],['DEPLOYMENT','DISABLED BY SAFETY GATE']];if(key==='security')rows=[['STATUS',c?.status?.toUpperCase()||'ONLINE'],['MODE','MONITOR / PROTECT'],['AUTOMATION','BOUNDED'],['AUTH','OWNER TOKEN REQUIRED']];if(key==='network')rows=[['STATUS','MONITORED'],['HEALTH CONTRACT','jarvis.health.v1'],['TELEMETRY','LIVE']];if(key==='sandbox')rows=[['STATUS','BOUNDED'],['EXECUTION','PERMISSION CONTROLLED'],['AUTONOMY','DISABLED']];title.textContent=map[key]||key.toUpperCase();body.innerHTML=rows.map(r=>'<div class="row"><span>'+esc(r[0])+'</span><span class="value">'+esc(r[1])+'</span></div>').join('');panel.classList.add('show')}
function apply(h){health=h;const overall=h.overall||'degraded';document.getElementById('status').textContent='● '+overall.toUpperCase();document.getElementById('status').className='status '+(overall==='online'?'':'off');const comps=h.components||[];const state=k=>(comps.find(x=>String(x.name).toLowerCase()===k)?.status)||'offline';['voice','memory','engineering','security','friday'].forEach(k=>{const n=document.querySelector('.node[data-key="'+k+'"]'),s=state(k);n.className='node '+(s==='online'||s==='standby'||s==='speaking'?'':'warn');if(s==='offline')n.classList.add('off')});const llm=document.querySelector('.node[data-key="llm"]');const bad=(h.providers||[]).filter(x=>['offline','payment_required'].includes(x.status)).length;llm.className='node '+(bad?'warn':'');document.getElementById('coreState').textContent='CORE '+overall.toUpperCase();eventText.innerHTML='<b>STARK EVENT BUS</b><br>UPTIME '+esc(fmtUptime(h.uptime_seconds))+' • '+esc((h.warnings||[])[0]||'All monitored subsystems reporting.')}
async function poll(){try{apply(await get('/hud/health'))}catch(e){document.getElementById('status').textContent='● AUTH / OFFLINE';document.getElementById('status').className='status off'}}
document.querySelectorAll('.node').forEach(n=>n.onclick=()=>renderPanel(n.dataset.key));document.querySelectorAll('.modebar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modebar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const m=b.dataset.mode;if(m==='SUIT LINK')renderPanel('engineering');else if(m==='SECURITY')renderPanel('security');else if(m==='COMMS')renderPanel('voice');else if(m==='ENGINEERING')renderPanel('engineering');else if(m==='DIAGNOSTICS'){renderPanel('memory');eventText.textContent='MODE // DIAGNOSTICS • LIVE HEALTH CONTRACT'}else if(m==='ANALYSIS')renderPanel('llm');else panel.classList.remove('show');if(m!=='DIAGNOSTICS')eventText.textContent='MODE // '+m+' ACTIVE'});poll();setInterval(poll,5000);
</script></body></html>
